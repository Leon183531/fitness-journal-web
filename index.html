<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f4f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="健身日记"><title>健身日记</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.png"></head><body><main>
<div id="fitness-journal">
  <header><div class="brand-mark" aria-hidden="true">✦</div><div><h1>健身日记</h1><small id="fj-subtitle">训练与心情</small></div></header>
  <article id="fj-install" hidden><details>
    <summary>添加到 iPhone 主屏幕</summary>
    <p>在 Safari 轻点「分享」，选择「添加到主屏幕」，再点「添加」。</p>
    <small>添加后，从主屏幕的「健身日记」图标打开并开始记录。</small>
  </details></article>
  <button id="fj-edit-done" type="button" hidden>‹ 完成编辑</button>
  <section id="fj-today">
    <article>
      <h2>训练</h2>
      <div id="fj-parts" class="chips"></div>
      <label>动作部位 <select id="fj-filter"></select></label>
      <div id="fj-actions" class="chips"></div>
    </article>
    <div id="fj-training"></div>
  </section>
  <section id="fj-journal" hidden>
    <article class="mood">
      <h2>心情</h2>
      <div class="chips" id="fj-moods"></div>
      <details id="fj-new-mood">
        <summary>＋ 自定义心情</summary>
        <form id="fj-create-mood">
          <div class="fields">
            <label>心情名称<input name="label" required maxlength="16" placeholder="比如 超有劲"></label>
            <label>Emoji<input name="icon" required maxlength="32" placeholder="比如 🔥"></label>
          </div>
          <div class="chips" id="fj-mood-icons" aria-label="常用 Emoji"></div>
          <button class="record" type="submit">保存心情</button>
          <small id="fj-mood-status" role="status"></small>
        </form>
      </details>
    </article>
    <article>
      <h2>日记</h2>
      <label>体重（kg）<input id="fj-body-weight" type="number" min="0.01" step="any" inputmode="decimal" placeholder="例如 68.5"></label>
      <small id="fj-weight-status" role="status"></small>
      <label class="journal-note">日记备注<textarea id="fj-note" rows="3" placeholder="写一句今天想记住的话…"></textarea></label>
      <div id="fj-photos"></div>
    </article>
    <article><h2>近 30 天体重趋势</h2><div id="fj-trend"></div></article>
    <article><details id="fj-compare-details">
      <summary>照片对比</summary>
      <div id="fj-compare"></div>
    </details></article>
    <article><details>
      <summary>迁移备份</summary>
      <p>将训练、日记、动作库和照片打包，在另一台设备导入。</p>
      <div class="row"><button id="fj-export" type="button">生成备份</button><a id="fj-download" hidden>下载备份文件</a></div>
      <label>选择备份文件<input id="fj-backup-file" type="file" accept=".json,application/json"></label>
      <div id="fj-backup-review"></div>
      <small id="fj-backup-status" role="status"></small>
    </details></article>
  </section>
  <section id="fj-calendar" hidden>
    <article>
      <div class="month"><button id="fj-prev" aria-label="上个月">‹</button><h2 id="fj-month"></h2><button id="fj-next" aria-label="下个月">›</button></div>
      <small id="fj-count"></small>
      <div id="fj-grid" class="grid" aria-label="月历"></div>
    </article>
    <article><details><summary>导入文字</summary>
      <label>粘贴备忘录<textarea id="fj-paste" rows="6" placeholder="2026.10.22 胸&#10;平板卧推&#10;50kg x10 x3"></textarea></label>
      <button id="fj-preview">预览导入</button>
      <div id="fj-review" aria-live="polite"></div>
    </details></article>
  </section>
  <section id="fj-entry" hidden>
    <button type="button" id="fj-back">‹ 返回日历</button>
    <article id="fj-day"></article>
  </section>
  <section id="fj-library" hidden>
    <article>
      <h2>动作库</h2>
      <details id="fj-new">
        <summary>＋ 新建动作</summary>
        <form id="fj-create">
          <div class="fields">
            <label>动作名称<input name="actionName" required maxlength="40"></label>
            <label>所属部位<select id="fj-new-part"></select></label>
          </div>
          <button class="record" type="submit">保存动作</button>
        </form>
      </details>
      <p id="fj-create-result" role="status"></p>
      <div id="fj-library-list"></div>
    </article>
  </section>
  <footer id="fj-footer">
    <div class="footer-card">
      <div id="fj-dock" hidden>
        <div><strong id="fj-active-action"></strong><small id="fj-active-sets" aria-live="polite"></small></div>
        <button id="fj-quick-set" class="record" type="button">记一组</button>
      </div>
      <nav aria-label="页面">
        <button data-page="today" aria-pressed="true">训练</button>
        <button data-page="journal" aria-pressed="false">日记</button>
        <button data-page="calendar" aria-pressed="false">日历</button>
        <button data-page="library" aria-pressed="false">动作库</button>
      </nav>
    </div>
  </footer>
</div>
</main>
<style>
:root {color-scheme:light dark; background:light-dark(#f5f4f7,#18171d)}
body {margin:0}
#fitness-journal {
  --paper:light-dark(#fff,#25242b); --soft:light-dark(#f1eef5,#34313c);
  --ink:light-dark(#262332,#f3eef8); --muted:light-dark(#655d70,#beb5c9);
  --plum:light-dark(#61477e,#d7baf5); --badge:light-dark(#eee4f8,#453553);
  --edge:light-dark(#eae5ee,#3e3848);
  color:var(--ink); font:15px/1.5 system-ui,sans-serif; max-width:480px; margin:auto;
  padding:max(16px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
    calc(var(--footer-height, 92px) + 8px) max(12px, env(safe-area-inset-left));
}
#fitness-journal header {display:flex; align-items:center; gap:12px; padding:2px 4px 18px}
#fitness-journal .brand-mark {display:grid; place-items:center; width:44px; height:44px; border-radius:15px; background:var(--plum); color:var(--paper); font-size:22px}
#fitness-journal h1,#fitness-journal h2,#fitness-journal h3,#fitness-journal p {margin:0}
#fitness-journal h1 {font-size:25px; letter-spacing:.025em}
#fitness-journal h2 {font-size:17px; margin-bottom:10px}
#fitness-journal h3 {font-size:15px; margin:8px 0}
#fitness-journal article {background:var(--paper); border:1px solid var(--edge); border-radius:21px; padding:14px; margin-bottom:12px}
#fitness-journal label,#fitness-journal small,#fitness-journal .field-label {color:var(--muted)}
#fitness-journal small {display:block}
#fitness-journal .chips,#fitness-journal .row {display:flex; flex-wrap:wrap; gap:6px; margin:8px 0}
#fitness-journal button,#fitness-journal input,#fitness-journal select,#fitness-journal textarea {
  font:inherit; color:var(--ink); background:var(--soft); border:1px solid transparent;
  border-radius:12px; min-height:44px; padding:6px 9px; box-sizing:border-box;
}
#fitness-journal button,#fitness-journal summary {cursor:pointer}
#fitness-journal button:disabled {opacity:.5; cursor:default}
#fitness-journal input,#fitness-journal textarea {width:100%; font-size:16px}
#fitness-journal select {max-width:100%; font-size:16px}
#fitness-journal :is(button,input,select,textarea,summary,a):focus-visible {outline:2px solid var(--plum); outline-offset:2px}
#fitness-journal button[aria-pressed=true],#fitness-journal .record {background:var(--plum); color:var(--paper)}
#fitness-journal .remove-action {color:light-dark(#a12c49,#f2a1b5)}
#fitness-journal .mood {background:linear-gradient(120deg,light-dark(#faebe7,#3a2b35),light-dark(#eae9f7,#2d3547))}
#fitness-journal #fj-moods button {display:flex; align-items:center; gap:5px; overflow-wrap:anywhere; text-align:left}
#fitness-journal #fj-moods span {font-size:19px}
#fitness-journal .grid {display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); text-align:center; gap:2px; margin-top:8px}
#fitness-journal .grid button {padding:4px 0; min-height:72px; display:flex; flex-direction:column; align-items:center; font-size:13px; background:transparent}
#fitness-journal .grid button[aria-current=date] {border-color:var(--edge); font-weight:700}
#fitness-journal .grid button[aria-pressed=true] {background:var(--badge); color:var(--ink)}
#fitness-journal .mark {display:block; width:max-content; margin:1px auto; padding:0 4px; border-radius:5px; background:var(--badge); color:var(--plum); font-size:11px}
#fitness-journal .circle {border-radius:50%}
#fitness-journal .day-extra {font-size:11px; color:var(--muted)}
#fitness-journal .fields {display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:8px 0}
#fitness-journal #fj-training .fields {grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
#fitness-journal footer {position:fixed; bottom:0; left:0; width:100%; box-sizing:border-box; z-index:2; background:light-dark(#f5f4f7,#18171d); padding:8px calc(12px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
#fitness-journal .footer-card {max-width:480px; margin:auto; box-sizing:border-box; background:var(--paper); border:1px solid var(--edge); border-radius:17px; box-shadow:0 3px 18px #22153116; padding:5px}
#fitness-journal nav {display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px}
#fitness-journal nav button {background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:13px}
#fitness-journal nav button[aria-pressed=true] {background:var(--badge); color:var(--plum)}
#fitness-journal #fj-back,#fitness-journal #fj-edit-done {margin-bottom:10px}
#fitness-journal #fj-dock {display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 6px 9px; margin-bottom:4px; border-bottom:1px solid var(--edge)}
#fitness-journal #fj-dock strong {overflow-wrap:anywhere}
#fitness-journal #fj-quick-set {flex:none; min-width:100px}
#fitness-journal #fj-dock[hidden] {display:none}
#fitness-journal .line-icon {width:19px; height:19px; vertical-align:-4px; flex:none}
#fitness-journal .action-label .line-icon {margin-right:4px}
#fitness-journal summary {box-sizing:border-box; min-height:44px; padding:10px 0; overflow-wrap:anywhere}
#fitness-journal .month {display:flex; align-items:center; justify-content:space-between; gap:6px}
#fitness-journal .month h2 {margin:0}
#fitness-journal .month button {min-width:44px; font-size:21px}
#fitness-journal textarea {margin:4px 0; resize:vertical}
#fitness-journal .wheel {display:flex; align-items:center; gap:3px}
#fitness-journal .wheel input {min-width:0; touch-action:pan-x}
#fitness-journal .entry-action,#fitness-journal .journal-note {margin-top:12px}
#fitness-journal .journal-note {display:block}
#fitness-journal #fj-photos,#fitness-journal .photo-panel {border-top:1px solid var(--edge); margin-top:12px; padding-top:5px}
#fitness-journal .photo-grid {display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:8px}
#fitness-journal .photo-grid figure {margin:0}
#fitness-journal .photo-grid img {display:block; width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:10px}
#fitness-journal .photo-grid button {margin-top:4px}
#fitness-journal .photo-grid select {width:100%; margin-bottom:6px}
#fitness-journal #fj-compare img {object-fit:contain; background:var(--soft)}
#fitness-journal .weight-chart {width:100%; display:block; color:var(--plum)}
#fitness-journal .weight-chart text {fill:var(--muted); font-size:11px}
#fitness-journal .trend-caption {margin-top:8px}
#fitness-journal #fj-day p {white-space:pre-wrap; overflow-wrap:anywhere}
</style>
<script type="module" src="./app.js"></script></body></html>
